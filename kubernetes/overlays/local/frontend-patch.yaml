apiVersion: apps/v1
kind: Deployment
metadata:
  name: ezur-frontend
  namespace: ezur
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker2
      containers:
        - name: frontend
          env:
            - name: APP_BASE_URL
              value: "http://192.168.237.130:30080"
            - name: SERVER_SERVLET_SESSION_COOKIE_SECURE
              value: "false"