apiVersion: apps/v1
kind: Deployment
metadata:
  name: ezur-database
  namespace: ezur
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ezur-database
  template:
    metadata:
      labels:
        app: ezur-database
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker1
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: ezur-db-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: ezur-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ezur-database
  namespace: ezur
spec:
  type: ClusterIP
  selector:
    app: ezur-database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
