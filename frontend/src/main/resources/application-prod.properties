# Perfil de producción: solo se activa con SPRING_PROFILES_ACTIVE=prod

server.port=${PORT:8080}

# Detrás del proxy del host: leer X-Forwarded-* para conocer la IP real y que la petición era https
server.forward-headers-strategy=native

# La cookie de sesión solo viaja por HTTPS y JavaScript no puede leerla
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
