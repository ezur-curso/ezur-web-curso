spring.application.name=ezur-web

# El sitio público escucha en el 8080; la API (ezur-api) en el 8081
server.port=${PORT:8080}

# Dirección de la API REST. En contenedores es el nombre del servicio, p. ej. http://backend:8081
api.url=${API_URL:http://localhost:8081}

# Dirección pública de este sitio (decide si la cookie del dispositivo de confianza es "secure")
app.base-url=${APP_BASE_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Datos de ejemplo de la empresa (se muestran en el pie, contacto y espacio de cliente)
empresa.nombre=EZUR Transporte y Mudanzas
empresa.telefono=+34 900 000 000
empresa.telefono-enlace=+34900000000
empresa.email=hola@ezur.example
empresa.direccion=Calle Ejemplo 123, 08000 Ciudad Ejemplo
