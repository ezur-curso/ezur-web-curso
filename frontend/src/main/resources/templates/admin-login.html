<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Acceso administración - Ezur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/output.css}" />
  </head>
  <body class="bg-gray-900 text-gray-100 font-sans">
    <main class="min-h-screen flex items-center justify-center px-4 py-10">
      <div class="w-full max-w-sm">
        <div class="flex items-center justify-center gap-2 mb-8">
          <img src="/img/logo.jpg" alt="Ezur" class="w-9 h-9 rounded" />
          <span class="font-semibold text-white">Ezur Admin</span>
        </div>

        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-8 shadow-xl">
          <h1 class="text-xl font-semibold text-white">Acceso de administración</h1>
          <p class="text-sm text-gray-400 mt-1 mb-6">Solo personal autorizado.</p>

          <p
            th:if="${param.reset}"
            class="text-sm text-green-300 bg-green-900/40 border border-green-700 rounded-lg px-4 py-3 mb-4"
          >
            Contraseña actualizada. Ya puedes iniciar sesión.
          </p>
          <p
            th:if="${param.error}"
            class="text-sm text-red-300 bg-red-900/40 border border-red-700 rounded-lg px-4 py-3 mb-4"
          >
            Usuario o clave incorrectos.
          </p>
          <p
            th:if="${param.inactivo}"
            class="text-sm text-yellow-200 bg-yellow-900/40 border border-yellow-700 rounded-lg px-4 py-3 mb-4"
          >
            Esta cuenta no está activa.
          </p>
          <p
            th:if="${param.perfil}"
            class="text-sm text-yellow-200 bg-yellow-900/40 border border-yellow-700 rounded-lg px-4 py-3 mb-4"
          >
            Esta cuenta no tiene perfil de administrador.
          </p>

          <form th:action="@{/login}" method="post" class="space-y-4">
            <input type="hidden" name="ambito" value="admin" />
            <div>
              <label for="username" class="block text-sm text-gray-300 mb-1">Usuario</label>
              <input
                type="text"
                name="username"
                id="username"
                autocomplete="username"
                required
                class="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <div>
              <label for="password" class="block text-sm text-gray-300 mb-1">Clave</label>
              <input
                type="password"
                name="password"
                id="password"
                autocomplete="current-password"
                required
                class="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <button
              type="submit"
              class="w-full bg-indigo-500 hover:bg-indigo-400 text-white text-sm font-medium py-2.5 rounded-lg transition"
            >
              Entrar al panel
            </button>
          </form>

          <p class="text-center mt-5">
            <a th:href="@{/olvide-password}" class="text-sm text-indigo-300 hover:underline"
              >¿Olvidaste tu contraseña?</a
            >
          </p>
        </div>

        <p class="text-center mt-6">
          <a href="/" class="text-sm text-gray-400 hover:text-gray-200">← Volver al sitio</a>
        </p>
      </div>
    </main>

    <script th:src="@{/js/evitar-doble-envio.js}" defer></script>
  </body>
</html>
