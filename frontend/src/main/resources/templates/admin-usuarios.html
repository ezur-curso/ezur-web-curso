<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/output.css" />
    <title>Usuarios - Ezur Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-50 min-h-screen flex">
    <aside class="w-64 bg-gray-900 text-gray-300 flex flex-col shrink-0">
      <div class="flex items-center gap-2 px-6 py-5 border-b border-gray-800">
        <img src="/img/logo.jpg" alt="Ezur" class="w-8 h-8 rounded" />
        <span class="font-sans font-semibold text-white text-sm">Ezur Admin</span>
      </div>

      <nav class="flex-1 px-3 py-4 space-y-1">
        <a href="/admin" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm">Solicitudes</a>
        <a href="/admin/mensajes" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm">Mensajes</a>
        <a href="/admin/testimonios" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm">Testimonios</a>
        <a href="/admin/usuarios" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-gray-800 text-white text-sm font-medium">Usuarios</a>
      </nav>

      <div class="px-3 py-4 border-t border-gray-800">
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm w-full text-left">
            Cerrar sesión
          </button>
        </form>
      </div>
    </aside>

    <main class="flex-1 min-w-0">
      <header class="bg-gray-50 border-b border-gray-200 px-8 py-4 flex items-center justify-between">
        <h1 class="text-lg font-semibold text-gray-900">Usuarios</h1>
        <a
          href="/admin/usuarios/nuevo"
          class="px-4 py-2 rounded-lg bg-gray-900 text-white text-sm font-medium hover:bg-gray-800"
          >+ Nuevo usuario</a
        >
      </header>

      <div class="p-8">
        <div th:if="${exito}" class="mb-4 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-800" th:text="${exito}">Hecho</div>
        <div th:if="${error}" class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" th:text="${error}">Error</div>

        <div class="bg-white rounded-xl border border-gray-200 overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase text-left">
              <tr>
                <th class="px-6 py-3 font-medium">DNI</th>
                <th class="px-6 py-3 font-medium">Nombre</th>
                <th class="px-6 py-3 font-medium">Usuario</th>
                <th class="px-6 py-3 font-medium">Perfil</th>
                <th class="px-6 py-3 font-medium">Estado</th>
                <th class="px-6 py-3 font-medium">Acciones</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
              <tr th:each="u : ${usuarios}" class="hover:bg-gray-50">
                <td class="px-6 py-4 text-gray-600" th:text="${u.dni}">00000000</td>
                <td class="px-6 py-4 font-medium text-gray-900" th:text="${u.nombreCompleto}">Nombre</td>
                <td class="px-6 py-4 text-gray-600" th:text="${u.usuario}">usuario</td>
                <td class="px-6 py-4 text-gray-600" th:text="${u.perfil.etiqueta}">Cliente</td>
                <td class="px-6 py-4">
                  <span
                    class="text-xs font-medium px-3 py-1 rounded-full"
                    th:classappend="${u.estado.name() == 'ACTIVO'} ? 'bg-green-50 text-green-700' : (${u.estado.name() == 'PENDIENTE'} ? 'bg-yellow-50 text-yellow-700' : 'bg-red-50 text-red-700')"
                    th:text="${u.estado.etiqueta}"
                    >Estado</span
                  >
                </td>
                <td class="px-6 py-4">
                  <div class="flex items-center gap-4 flex-wrap">
                    <form
                      th:if="${u.estado.name() != 'ACTIVO'}"
                      th:action="@{/admin/usuarios/{id}/estado(id=${u.id})}"
                      method="post"
                    >
                      <input type="hidden" name="estado" value="ACTIVO" />
                      <button type="submit" class="text-sm font-medium text-green-700 hover:underline">Activar</button>
                    </form>
                    <form
                      th:if="${u.estado.name() != 'ANULADO' and u.usuario != actual}"
                      th:action="@{/admin/usuarios/{id}/estado(id=${u.id})}"
                      method="post"
                    >
                      <input type="hidden" name="estado" value="ANULADO" />
                      <button type="submit" class="text-sm font-medium text-yellow-700 hover:underline">Anular</button>
                    </form>
                    <a
                      th:href="@{/admin/usuarios/{id}/editar(id=${u.id})}"
                      class="text-sm font-medium text-gray-900 hover:underline"
                      >Editar</a
                    >
                    <form
                      th:if="${u.usuario != actual}"
                      th:action="@{/admin/usuarios/{id}/eliminar(id=${u.id})}"
                      method="post"
                      class="form-eliminar"
                      th:attr="data-nombre=${u.usuario}"
                    >
                      <button type="submit" class="text-sm font-medium text-red-600 hover:underline">Eliminar</button>
                    </form>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="6" class="px-6 py-10 text-center text-gray-500">Aún no hay usuarios.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script>
      document.querySelectorAll(".form-eliminar").forEach(function (form) {
        form.addEventListener("submit", function (e) {
          var nombre = form.dataset.nombre;
          if (!confirm('¿Eliminar al usuario "' + nombre + '"? Esta acción no se puede deshacer.')) {
            e.preventDefault();
          }
        });
      });
    </script>
  </body>
</html>
