<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/output.css" />
    <title>Testimonio - Ezur Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-50 min-h-screen flex">
    <aside class="w-64 bg-gray-900 text-gray-300 flex flex-col shrink-0">
      <div class="flex items-center gap-2 px-6 py-5 border-b border-gray-800">
        <img src="/img/logo.jpg" alt="Ezur" class="w-8 h-8 rounded" />
        <span class="font-sans font-semibold text-white text-sm"
          >Ezur Admin</span
        >
      </div>

      <nav class="flex-1 px-3 py-4 space-y-1">
        <a
          href="/admin"
          class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm"
          >Solicitudes</a
        >
        <a
          href="/admin/mensajes"
          class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm"
          >Mensajes</a
        >
        <a
          href="/admin/testimonios"
          class="flex items-center gap-3 px-3 py-2 rounded-lg bg-gray-800 text-white text-sm font-medium"
          >Testimonios</a
        >
        <a
          href="/admin/usuarios"
          class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm"
          >Usuarios</a
        >
      </nav>

      <div class="px-3 py-4 border-t border-gray-800">
        <form th:action="@{/logout}" method="post">
          <button
            type="submit"
            class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm w-full text-left"
          >
            Cerrar sesión
          </button>
        </form>
      </div>
    </aside>

    <main class="flex-1">
      <header class="bg-gray-50 border-b border-gray-200 px-8 py-4">
        <h1 class="text-lg font-semibold text-gray-900" th:text="${titulo}">
          Testimonio
        </h1>
      </header>

      <div class="p-8 max-w-2xl">
        <form
          th:action="@{${accion}}"
          th:object="${testimonio}"
          method="post"
          class="bg-white rounded-xl border border-gray-200 p-6 space-y-5"
        >
          <div>
            <label
              for="nombre"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Nombre del cliente</label
            >
            <input
              type="text"
              id="nombre"
              th:field="*{nombre}"
              maxlength="100"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm"
            />
            <p
              th:if="${#fields.hasErrors('nombre')}"
              th:errors="*{nombre}"
              class="mt-1 text-xs text-red-600"
            ></p>
          </div>

          <div>
            <label
              for="servicio"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Servicio (opcional)</label
            >
            <select
              id="servicio"
              th:field="*{servicio}"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm"
            >
              <option value="">Sin servicio</option>
              <option
                th:each="t : ${tiposServicio}"
                th:value="${t.nombre}"
                th:text="${t.nombre}"
              ></option>
              <option
                th:if="${servicioExtra != null}"
                th:value="${servicioExtra}"
                th:text="${servicioExtra}"
              ></option>
            </select>
            <p
              th:if="${#fields.hasErrors('servicio')}"
              th:errors="*{servicio}"
              class="mt-1 text-xs text-red-600"
            ></p>
          </div>

          <div>
            <label
              for="texto"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Testimonio</label
            >
            <textarea
              id="texto"
              th:field="*{texto}"
              rows="5"
              maxlength="500"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm"
            ></textarea>
            <p
              th:if="${#fields.hasErrors('texto')}"
              th:errors="*{texto}"
              class="mt-1 text-xs text-red-600"
            ></p>
          </div>

          <div>
            <label
              for="estrellas"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Estrellas</label
            >
            <select
              id="estrellas"
              th:field="*{estrellas}"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm"
            >
              <option
                th:each="n : ${#numbers.sequence(5, 1)}"
                th:value="${n}"
                th:text="${n == 1 ? '1 estrella' : n + ' estrellas'}"
              ></option>
            </select>
            <p
              th:if="${#fields.hasErrors('estrellas')}"
              th:errors="*{estrellas}"
              class="mt-1 text-xs text-red-600"
            ></p>
          </div>

          <div class="flex items-center gap-3 pt-2">
            <button
              type="submit"
              class="px-5 py-2 rounded-lg bg-gray-900 text-white text-sm font-medium hover:bg-gray-800"
            >
              Guardar
            </button>
            <a
              href="/admin/testimonios"
              class="px-5 py-2 rounded-lg border border-gray-300 text-sm text-gray-700 hover:bg-gray-50"
            >
              Cancelar
            </a>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
