<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta - Ezur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:ital,wght@0,400..700;1,400..600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/output.css}" />
    <style>
      :root {
        --ink: #0d2240;
        --ink-2: #51617d;
        --paper: #ffffff;
        --line: #c3cfe2;
        --azul: #1a67d1;
        --rojo: #8f2330;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Public Sans", system-ui, sans-serif;
      }
      .serif {
        font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      h1.serif em,
      h2.serif em {
        font-style: normal;
        color: var(--azul);
      }
      ::selection { background: var(--azul); color: #fff; }
      :focus-visible { outline: 2px solid var(--azul); outline-offset: 3px; border-radius: 6px; }
      .campo {
        width: 100%;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 0.6rem;
        padding: 0.7rem 0.85rem;
        font-size: 0.95rem;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .campo:focus {
        outline: none;
        border-color: var(--azul);
        box-shadow: 0 0 0 3px rgba(31, 111, 229, 0.18);
      }
      .error-campo { margin-top: 0.3rem; font-size: 0.78rem; color: var(--rojo); }
    </style>
  </head>
  <body class="antialiased">
    <div class="grid min-h-screen lg:grid-cols-[1fr_1.05fr]">
      <aside class="relative hidden overflow-hidden lg:block" style="background: var(--ink)">
        <img
          src="/img/galeria/mud2.png"
          alt="Interior de un camión con muebles protegidos"
          class="absolute inset-0 h-full w-full object-cover"
          style="object-position: 50% 55%"
        />
        <div class="absolute inset-0" style="background: linear-gradient(to top, rgba(12, 26, 51, 0.95) 8%, rgba(12, 26, 51, 0.3) 55%, rgba(12, 26, 51, 0.1))"></div>
        <div class="relative flex h-full flex-col justify-between p-10 xl:p-14">
          <a href="/" class="flex w-fit items-center gap-2 text-white" aria-label="Volver al sitio de Ezur">
            <img src="/img/logo.jpg" alt="" class="h-9 w-9 rounded" />
            <span class="serif text-xl">EZUR</span>
          </a>
          <p class="serif max-w-md text-4xl leading-[1.08] text-white xl:text-5xl">
            Crea tu cuenta y <em class="text-[#8fbfff]">sigue tu mudanza</em> desde el primer día.
          </p>
        </div>
      </aside>

      <main class="flex flex-col px-6 py-8 sm:px-12">
        <div class="flex items-center justify-between lg:justify-end">
          <a href="/" class="flex items-center gap-2 lg:hidden" aria-label="Volver al sitio de Ezur">
            <img src="/img/logo.jpg" alt="" class="h-8 w-8 rounded" />
            <span class="serif text-lg">EZUR</span>
          </a>
          <a href="/" class="text-sm text-[var(--ink-2)] hover:text-[var(--ink)]">← Volver al sitio</a>
        </div>

        <div class="mx-auto w-full max-w-md flex-1 py-8">
          <h1 class="serif text-4xl leading-tight sm:text-5xl">Crear cuenta</h1>
          <p class="mt-3 text-[var(--ink-2)]">
            Un administrador de Ezur activará tu cuenta antes de que puedas entrar.
          </p>

          <form th:action="@{/registro}" th:object="${registro}" method="post" class="mt-8 space-y-5">
            <div>
              <label for="dni" class="mb-1.5 block text-sm font-medium">DNI</label>
              <input type="text" id="dni" th:field="*{dni}" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" class="campo" />
              <p th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}" class="error-campo"></p>
            </div>

            <div class="grid gap-5 sm:grid-cols-2">
              <div>
                <label for="nombres" class="mb-1.5 block text-sm font-medium">Nombres</label>
                <input type="text" id="nombres" th:field="*{nombres}" maxlength="100" autocomplete="given-name" class="campo" />
                <p th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}" class="error-campo"></p>
              </div>
              <div>
                <label for="apellidos" class="mb-1.5 block text-sm font-medium">Apellidos</label>
                <input type="text" id="apellidos" th:field="*{apellidos}" maxlength="100" autocomplete="family-name" class="campo" />
                <p th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}" class="error-campo"></p>
              </div>
            </div>

            <div>
              <label for="usuario" class="mb-1.5 block text-sm font-medium">Usuario</label>
              <input type="text" id="usuario" th:field="*{usuario}" maxlength="30" autocomplete="username" class="campo" />
              <p th:if="${#fields.hasErrors('usuario')}" th:errors="*{usuario}" class="error-campo"></p>
            </div>

            <div>
              <label for="clave" class="mb-1.5 block text-sm font-medium">Clave <span class="font-normal text-[var(--ink-2)]">(mínimo 10 caracteres)</span></label>
              <input type="password" id="clave" th:field="*{clave}" maxlength="72" autocomplete="new-password" class="campo" />
              <p th:if="${#fields.hasErrors('clave')}" th:errors="*{clave}" class="error-campo"></p>
            </div>

            <div>
              <label for="perfil" class="mb-1.5 block text-sm font-medium">Perfil</label>
              <select id="perfil" th:field="*{perfil}" class="campo">
                <option th:each="p : ${perfiles}" th:value="${p}" th:text="${p.etiqueta}"></option>
              </select>
              <p th:if="${#fields.hasErrors('perfil')}" th:errors="*{perfil}" class="error-campo"></p>
            </div>

            <button
              type="submit"
              class="w-full rounded-lg px-4 py-3 text-sm font-semibold text-white transition hover:brightness-90"
              style="background: var(--azul)"
            >
              Crear cuenta
            </button>
          </form>

          <p class="mt-8 text-sm text-[var(--ink-2)]">
            ¿Ya tienes cuenta?
            <a th:href="@{/login}" class="font-semibold text-[var(--azul)] hover:underline">Entrar</a>
          </p>
        </div>
      </main>
    </div>

    <script th:src="@{/js/evitar-doble-envio.js}" defer></script>
  </body>
</html>
