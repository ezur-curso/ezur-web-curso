<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Nueva contraseña - EZUR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/output.css" />
  </head>
  <body class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
    <div class="w-full max-w-sm bg-white shadow-xl rounded-2xl p-8">
      <div class="flex items-center justify-center gap-2 mb-6">
        <img th:src="@{/img/logo.jpg}" alt="Ezur" class="w-8 h-8 rounded" />
        <span class="font-serif text-lg text-gray-900">EZUR</span>
      </div>

      <div th:if="${tokenInvalido}">
        <h1 class="font-serif text-xl text-gray-900 text-center mb-4">
          Enlace no válido
        </h1>
        <p
          class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-4 py-3 mb-4"
        >
          Este enlace no es válido, ya se usó o venció.
        </p>
        <p class="text-center">
          <a
            th:href="@{/olvide-password}"
            class="text-sm text-indigo-600 hover:underline"
            >Pedir un enlace nuevo</a
          >
        </p>
      </div>

      <div th:unless="${tokenInvalido}">
        <h1 class="font-serif text-xl text-gray-900 text-center mb-2">
          Elegí tu nueva contraseña
        </h1>
        <p class="text-sm text-gray-500 text-center mb-6">
          Mínimo 10 caracteres.
        </p>

        <p
          th:if="${error}"
          th:text="${error}"
          class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-4 py-3 mb-4"
        ></p>

        <form
          th:action="@{/restablecer-password}"
          method="post"
          class="space-y-4"
        >
          <input type="hidden" name="token" th:value="${token}" />
          <div>
            <label for="password" class="block text-sm text-gray-700 mb-1"
              >Contraseña nueva</label
            >
            <input
              type="password"
              name="password"
              id="password"
              required
              minlength="10"
              autocomplete="new-password"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
            />
          </div>
          <div>
            <label for="confirmacion" class="block text-sm text-gray-700 mb-1"
              >Repetí la contraseña</label
            >
            <input
              type="password"
              name="confirmacion"
              id="confirmacion"
              required
              minlength="10"
              autocomplete="new-password"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2 rounded-lg transition"
          >
            Guardar contraseña
          </button>
        </form>
      </div>
    </div>

    <script th:src="@{/js/evitar-doble-envio.js}" defer></script>
  </body>
</html>
