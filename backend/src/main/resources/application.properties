spring.application.name=ezur-api

# La API escucha en el 8081; el frontend (el sitio público) usa el 8080
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ezur_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

notificaciones.email.destino=${MAIL_DESTINO}

# Dirección pública del FRONTEND: los correos (p. ej. restablecer contraseña) enlazan ahí
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Firma de los tokens de acceso (mínimo 32 caracteres). En producción se define JWT_SECRETO.
app.jwt.secreto=${JWT_SECRETO:solo-para-desarrollo-local-cambiar-en-produccion-0123456789}
app.jwt.minutos=120

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# No mantener una conexión abierta a la base de datos mientras se responde
spring.jpa.open-in-view=false
