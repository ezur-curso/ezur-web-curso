# Perfil de producción: solo se activa con SPRING_PROFILES_ACTIVE=prod

# No imprimir las consultas SQL en los logs
spring.jpa.show-sql=false

# Hibernate NO modifica las tablas; solo comprueba que coincidan con las entidades
spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El host indica el puerto por la variable PORT
server.port=${PORT:8081}

# Detrás del proxy del host: leer X-Forwarded-* para conocer la IP real y que la petición era https
server.forward-headers-strategy=native

# Sin valor por defecto: si falta JWT_SECRETO la API no arranca
app.jwt.secreto=${JWT_SECRETO}
